name: Responsive Hardening
permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  responsive-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - run: npx playwright install --with-deps
      - run: pnpm build
      - run: pnpm test:e2e

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.json'
